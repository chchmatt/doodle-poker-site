<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doodle Poker</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="../icon.png">
<style>
  @font-face { font-family: "Permanent Marker"; src: url("PermanentMarker-Latin.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  :root {
    --paper: #eef2f6;
    --grid: #dbe3ec;
    --card: #fbfcfd;
    --ink: #1b2a41;
    --pencil: #5d6b7c;
    --felt: #1f7a4d;
    --marker: #e8730c;
    --redpen: #c0392b;
    --rule: #1b2a41;
    --hand: "Permanent Marker", "Ink Free", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
    --body: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --wobble: 255px 14px 225px 14px / 14px 225px 14px 255px;
    --wobble-small: 120px 10px 110px 10px / 10px 110px 10px 120px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #17222c;
      --grid: #1f2d39;
      --card: #1c2a36;
      --ink: #e8eef3;
      --pencil: #9aa9b8;
      --felt: #4fc48a;
      --marker: #ff9a3d;
      --redpen: #ff7b6b;
      --rule: #e8eef3;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0;
    color: var(--ink);
    font: 16px/1.5 var(--body);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    min-height: 100vh;
  }
  main { max-width: 760px; margin: 0 auto; padding: 28px 20px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { font: 400 30px/1.1 var(--hand); margin: 0; letter-spacing: 0.01em; }
  #fresh { color: var(--pencil); font-size: 14px; }
  #fresh.stale { color: var(--redpen); font-weight: 600; }
  #watcher { color: var(--pencil); font-size: 14px; flex-basis: 100%; margin: 0; }
  #watcher.stale { color: var(--redpen); font-weight: 600; }
  .notice {
    margin: 16px 0 0; padding: 10px 14px; font-size: 14px;
    border: 2px dashed var(--pencil); border-radius: var(--wobble-small); color: var(--pencil);
  }
  .notice.warn { border-color: var(--redpen); color: var(--redpen); }
  [hidden] { display: none !important; }
  #now {
    margin-top: 22px; padding: 22px 24px 20px;
    background: var(--card);
    border: 2.5px solid var(--rule);
    border-radius: var(--wobble);
    box-shadow: 5px 6px 0 var(--rule);
  }
  .now-head { display: flex; gap: 16px; align-items: flex-start; }
  .now-num {
    font: 400 56px/0.9 var(--hand); color: var(--marker);
    min-width: 1.2em; text-align: center; flex: none;
  }
  /* 4 or more digits: the number gets smaller by its digit count so the title keeps its room (the digits are counted in the script; there is no list of numbers) */
  .now-num[data-digits="4"] { font-size: 40px; }
  .now-num[data-digits="5"] { font-size: 32px; }
  .now-num[data-digits="6"] { font-size: 27px; }
  .now-title { font: 400 23px/1.25 var(--hand); margin: 4px 0 0; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .now-doing { margin: 14px 0 0; font-size: 17px; }
  .now-doing b { font-weight: 600; }
  .bar {
    position: relative; height: 30px; margin-top: 14px;
    border: 2.5px solid var(--rule); border-radius: var(--wobble-small);
    overflow: hidden; background: transparent;
  }
  .bar > i {
    display: block; height: 100%; width: 0;
    background:
      repeating-linear-gradient(-58deg, var(--marker) 0 5px, transparent 5px 9px);
    border-right: 2.5px solid var(--rule);
    transition: width 0.6s ease;
  }
  .bar.done > i { background: repeating-linear-gradient(-58deg, var(--felt) 0 5px, transparent 5px 9px); }
  .bar-end { text-align: right; margin-top: 4px; font-size: 14px; color: var(--pencil); }
  .bar-end strong { color: var(--ink); font-weight: 600; }

  .bar-words { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; font-size: 14px; color: var(--pencil); flex-wrap: wrap; }
  .bar-words strong { color: var(--ink); font-weight: 600; }
  ol.steps { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 4px; font-size: 15px; }
  ol.steps li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: baseline; color: var(--pencil); }
  ol.steps li .mark { font: 400 16px/1 var(--hand); text-align: center; }
  ol.steps li.done { color: var(--ink); }
  ol.steps li.done .mark { color: var(--felt); }
  ol.steps li.on { color: var(--ink); font-weight: 600; }
  ol.steps li.on .mark { color: var(--marker); }
  @media (prefers-reduced-motion: no-preference) {
    ol.steps li.on .mark { animation: nudge 1.4s ease-in-out infinite; }
    @keyframes nudge { 50% { transform: translateX(3px); } }
  }
  h2 { font: 400 21px/1.2 var(--hand); margin: 36px 0 0; }
  .list-count { color: var(--pencil); font-size: 14px; margin-top: 2px; }
  .bar.thin { height: 16px; margin-top: 8px; }
  ul.items { list-style: none; margin: 14px 0 0; padding: 0; }
  ul.items li {
    display: grid; grid-template-columns: var(--numw, 2.4em) 1fr auto; gap: 10px; align-items: baseline;
    padding: 8px 2px; border-bottom: 1.5px dashed var(--grid);
  }
  ul.items .num { font: 400 18px/1.2 var(--hand); white-space: nowrap; text-align: right; color: var(--pencil); }
  ul.items .title { min-width: 0; }
  ul.items .when { display: block; font-size: 13px; color: var(--pencil); }
  ul.items .chip {
    font-size: 13px; font-weight: 600; padding: 1px 10px; white-space: nowrap;
    border: 2px solid currentColor; border-radius: var(--wobble-small); color: var(--pencil);
  }
  ul.items li.done .title { color: var(--pencil); }
  ul.items li.done .chip, ul.items li.done .num { color: var(--felt); }
  ul.items li.part .chip, ul.items li.part .num { color: var(--felt); }
  /* the item in play in the list */
  .is-working { background: color-mix(in srgb, var(--marker) 12%, transparent); }
  .is-working .chip, .is-working .num { color: var(--marker); }
  .is-working .title { font-weight: 600; }
  ul.tasks .when { color: var(--pencil); font-size: 13px; margin-left: 8px; white-space: nowrap; }
  ul.items li.blocked .chip, ul.items li.blocked .num { color: var(--redpen); }
  ul.items li.needs .chip { color: var(--ink); border-style: dashed; }
  /* an item on hold (item 124): a pause mark and the word, in a plain muted look; never the look of an item in play */
  ul.items li.paused .chip { color: var(--pencil); border-style: dotted; }
  ul.items li.paused .chip::before { content: '‖ '; font-weight: 700; }
  ul.items li.paused .title { color: var(--pencil); }
  footer { margin-top: 40px; font-size: 13px; color: var(--pencil); }
  @media (max-width: 520px) {
    .now-num { font-size: 44px; }
    .now-num[data-digits="4"] { font-size: 32px; }
    .now-num[data-digits="5"] { font-size: 26px; }
    .now-num[data-digits="6"] { font-size: 22px; }
    .now-title { font-size: 20px; }
    ul.items li { grid-template-columns: var(--numw, 2em) 1fr; }
    ul.items .chip { grid-column: 2; justify-self: start; }
  }
  .asking { margin: 16px 0 0; padding: 12px 16px; font: 400 19px/1.3 var(--hand); color: var(--ink); background: var(--marker); border-radius: var(--wobble-small); }
  /* under an item's title in the list: why it needs the player (item 121), what it waits for and holds up, and who queued it (item 117) */
  ul.items .what, ul.items .deps { display: block; font-size: 14px; font-weight: 400; color: var(--pencil); overflow-wrap: anywhere; }
  ul.items .deps .ok { color: var(--teal-ink, var(--pencil)); }
  ul.tasks { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; font-size: 15px; }
  ul.tasks li { display: grid; grid-template-columns: 22px 1fr; gap: 2px 8px; align-items: baseline; color: var(--pencil); }
  ul.tasks li .mark { font: 400 16px/1 var(--hand); text-align: center; }
  ul.tasks li.done { color: var(--ink); }
  ul.tasks li.done .mark { color: var(--felt); }
  ul.tasks li.on { color: var(--ink); }
  ul.tasks li.on .mark { color: var(--marker); }
  ul.tasks .label { min-width: 0; }
  ul.tasks .late { display: block; font-size: 13px; color: var(--pencil); }
  ul.tasks .tbar { grid-column: 2; height: 9px; border: 2px solid var(--rule); border-radius: var(--wobble-small); overflow: hidden; }
  ul.tasks .tbar > i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(-58deg, var(--marker) 0 4px, transparent 4px 7px); }
  ul.tasks li.done .tbar > i { background: repeating-linear-gradient(-58deg, var(--felt) 0 4px, transparent 4px 7px); }
  ul.tasks ul.sub { grid-column: 2; list-style: none; margin: 4px 0 0; padding: 0 0 0 14px; display: grid; gap: 6px; font-size: 14px; }
  ul.tasks ul.sub li { grid-template-columns: 18px 1fr; }
  ul.tasks ul.sub .tbar { height: 6px; border-width: 1.5px; }
  .guess { margin: 10px 0 0; font-size: 13px; color: var(--pencil); }
  @media (prefers-reduced-motion: reduce) { .bar > i, ul.tasks .tbar > i { transition: none; } }
  @media (prefers-reduced-motion: no-preference) { ul.tasks .tbar > i { transition: width 0.9s linear; } }
  .counts { margin: 12px 0 0; font-size: 15px; }
  ul.items.finished li .title { color: var(--pencil); }
</style>
</head>
<body>
<main id="page" hidden></main>

<script>
(function () {
  'use strict';

  // The data is one small JSON file in the store that holds the published hands. Its name is the part of the link after the # (a browser never sends that to a server), so the page itself holds no name.
  var STORE = 'https://doodlepokerhands.blob.core.windows.net/build/';
  var CHECK_EVERY = 10000;               // how often the page looks at the file again, while it is in front
  var CHECK_DONE = 60000;                // ...and when everything is done: nothing is expected
  var WATCHER_QUIET_AFTER = 3 * 60 * 1000; // a build is going and the watcher has not looked for this long: the page may be out of date
  var QUIET_AFTER = 15 * 60 * 1000;      // no update for this long past the running step's estimate: the builder may have stopped
  var BUILDER_QUIET_AFTER = 10 * 60 * 1000; // a run is going and the builder has written nothing for this long (item 120)
  var BETWEEN_QUIET_AFTER = 10 * 60 * 1000; // between two items for this long: the builder may have stopped (item 86)
  var CAP = 0.95;                        // a step that is not done never shows more than this

  // the structure of the page: not in the page until the first good answer (a wrong link must show nothing of it)
  var MARKUP = `<p id="asking" class="asking" hidden></p>
  <header>
    <h1>Doodle Poker build</h1>
    <span id="fresh" role="status"></span>
    <span id="watcher" role="status" hidden></span>
  </header>

  <p id="failed" class="notice warn" hidden></p>
  <p id="stale" class="notice warn" hidden></p>
  <p id="paused" class="notice warn" hidden></p>

  <section id="now" aria-live="polite">
    <div class="now-head">
      <div class="now-num" id="now-num"></div>
      <p class="now-title" id="now-title"></p>
    </div>
    <p class="now-doing" id="now-doing"></p>
    <div class="bar" id="now-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i></i></div>
    <div class="bar-end" id="now-end" hidden></div>
    <div class="bar-words" id="bar-words">
      <span id="now-pct"></span>
      <span id="now-time"></span>
    </div>
    <p class="counts" id="counts" hidden></p>
    <ul class="tasks" id="tasks"></ul>
    <p class="notice warn" id="builder-quiet" hidden></p>
    <p class="guess" id="guess" hidden>The bars are a guess from how long each step usually takes. They move by themselves between updates and never reach full until the step is done.</p>
  </section>

  <h2>The list</h2>
  <div class="list-count" id="list-count"></div>
  <div class="bar thin done" id="list-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i></i></div>
  <ul class="items" id="items"></ul>

  <section id="done-part" hidden>
    <h2 id="done-head">Done</h2>
    <ul class="items finished" id="done-items"></ul>
  </section>

  <footer id="foot">This page reads one small file while it is in front. Leave it open.</footer>`;
  var built = false;
  function build() {
    if (built) return;
    built = true;
    var doc = new DOMParser().parseFromString('<body>' + MARKUP + '</body>', 'text/html');
    document.getElementById('page').append.apply(document.getElementById('page'), Array.prototype.slice.call(doc.body.childNodes));
  }

  var data = null;
  var between = null;                    // the gap between two items (item 86): {text, at}, or null while an item is in play
  var gotGood = false;
  var scale = 1;                         // item 122: what the last 20 items took over what was guessed for them (the file's `scale`, 0.2 to 1.5); 1 when the file has none
  var shown = {};                        // the highest each bar has shown (a bar never goes backwards)
  var name = location.hash.replace(/^#/, '');
  var $ = function (id) { return document.getElementById(id); };
  // the column for the item numbers is as wide as the longest number in its list (a minimum, never a fixed width), so the titles line up on every row and nothing wraps under a number
  var numWidth = function (ul, list) {
    var d = 0;
    list.forEach(function (i) { d = Math.max(d, String(i && i.number).length); });
    ul.style.setProperty('--numw', Math.max(2.4, d * 0.7 + 0.5) + 'em');
  };
  var el = function (tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  var clock = function (iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  };
  var span = function (ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + ' s';
    var m = Math.round(s / 60);
    if (m < 60) return m + ' min';
    var h = Math.floor(m / 60);
    return h + ' h ' + (m % 60) + ' min';
  };

  var STATES = {
    'done':     { cls: 'done',    chip: 'Done' },
    'part':     { cls: 'part',    chip: 'Done in part' },
    'blocked':  { cls: 'blocked', chip: 'Blocked' },
    'working':  { cls: 'working', chip: 'Working' },
    'waiting':  { cls: 'waiting', chip: 'Waiting' },
    'needs-you':{ cls: 'needs',   chip: 'Needs you' },
    'paused':   { cls: 'paused',  chip: 'Paused' }
  };
  /* The list's bar from the number of items remaining, and nothing else (item 123): none 100, one 90 (the last item is not finished until it is), N of two or more 100 over N. */
  var LAST_ONE_PERCENT = 90;
  function remainingPercent(n) {
    if (n <= 0) return 100;
    if (n === 1) return LAST_ONE_PERCENT;
    return 100 / n;
  }
  var isFinished = function (i) { return i.state === 'done' || i.state === 'part'; };

  /* ---------- the guess at a step's progress (0 to 1): the page moves it, the builder only says when it is done ---------- */

  function fake(t, nowMs) {
    if (t.state === 'done') return 1;
    if (t.subtasks && t.subtasks.length) {
      var sum = 0;
      t.subtasks.forEach(function (s) { sum += fake(s, nowMs); });
      var mean = sum / t.subtasks.length;
      return t.state === 'done' ? 1 : Math.min(CAP, mean);
    }
    if (t.state !== 'on') return 0;
    var real = typeof t.percent === 'number' ? Math.max(0, Math.min(CAP, t.percent / 100)) : 0;
    var est = (t.estimateSec || 0) * 1000 * scale;
    var started = t.startedAt ? new Date(t.startedAt).getTime() : nowMs;
    var guess = 0;
    if (est > 0) {
      var r = Math.max(0, (nowMs - started) / est);
      guess = r >= 1 ? CAP : CAP * (1 - Math.pow(1 - r, 1.2)); // eases: slows as it nears the end, and sits at 95% when it runs over
    }
    return Math.min(CAP, Math.max(guess, real));
  }

  // never backwards on screen
  function steady(key, value) {
    var v = Math.max(value, shown[key] || 0);
    shown[key] = v;
    return v;
  }

  function overrun(t, nowMs) {
    if (t.state !== 'on' || !t.estimateSec || !t.startedAt) return false;
    return nowMs - new Date(t.startedAt).getTime() > t.estimateSec * 1000 * (1 + 1 / 3);
  }

  /* ---------- the estimated finish of the item in play (a pure function: the time now plus the time still to run, over the tasks not done) ---------- */

  /* finishTime:start */
  function finishTime(tasks, nowMs, scaleBy) {
    var k = typeof scaleBy === 'number' && scaleBy >= 0.2 && scaleBy <= 1.5 ? scaleBy : 1; // (item 122: the remaining estimates are multiplied by what the record says they usually come to)
    var leaves = [];
    (function collect(list) {
      (list || []).forEach(function (t) {
        if (t && t.subtasks && t.subtasks.length) collect(t.subtasks); // (a task with subtasks counts by its subtasks, as the bars do)
        else if (t) leaves.push(t);
      });
    })(tasks);
    var known = leaves.filter(function (t) { return t.estimateSec > 0; });
    if (!known.length) return null; // (no estimates at all: no time is shown)
    var avg = known.reduce(function (s, t) { return s + t.estimateSec * 1000; }, 0) / known.length; // (a task with no estimate counts the average of the others)
    var remaining = 0;
    var later = false;
    leaves.forEach(function (t) {
      if (t.state === 'done') return;
      var est = (t.estimateSec > 0 ? t.estimateSec * 1000 : avg) * k;
      if (t.state === 'on' && t.startedAt) {
        var elapsed = nowMs - new Date(t.startedAt).getTime();
        if (elapsed > est) later = true;
        remaining += Math.max(est - elapsed, est * 0.2); // (over its estimate it still counts a small floor, so the time keeps moving later)
      } else remaining += est;
    });
    if (remaining <= 0) return null;
    return { ms: nowMs + remaining, later: later, scaled: k !== 1 };
  }
  /* finishTime:end */

  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  function finishWords(f, nowMs) {
    var d = new Date(f.ms);
    var day = d.getDate() !== new Date(nowMs).getDate() ? DAYS[d.getDay()] + ' ' : '';
    return [f.later ? 'later than guessed, now about ' : 'done about ', day + clock(d.toISOString()), f.scaled ? ' (a guess, scaled from the last 20 items)' : ''];
  }

  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  /* A time of day, with the weekday and date before it when it was not today (in the viewer's own time zone). */
  function stamp(iso, nowMs) {
    var d = new Date(iso);
    var today = new Date(nowMs);
    var same = d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth() && d.getDate() === today.getDate();
    return (same ? '' : DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ', ') + clock(iso);
  }
  /* finishedWords:start */
  /* What a finished item's line says: when it started and how long it took; only the time that is known; and never a negative or a blank duration (a finish before the start shows the start only). */
  function doneWords(i, nowMs) {
    var s = i.startedAt ? new Date(i.startedAt).getTime() : NaN;
    var f = i.finishedAt ? new Date(i.finishedAt).getTime() : NaN;
    if (!isNaN(s) && !isNaN(f) && f >= s) return 'Started ' + stamp(i.startedAt, nowMs) + ', took ' + span(f - s);
    if (!isNaN(s)) return 'Started ' + stamp(i.startedAt, nowMs);
    if (!isNaN(f)) return 'Finished ' + stamp(i.finishedAt, nowMs);
    return '';
  }
  /* finishedWords:end */

  /* ---------- times of tasks, and the gap between items ---------- */

  /* taskWords:start */
  /* What a task's line says (item 88): a done task, when it started and how long it took; a task that is on, when it started and how long it has been on; a task still to do, nothing; never a negative duration. */
  function taskWords(t, nowMs) {
    var s = t.startedAt ? new Date(t.startedAt).getTime() : NaN;
    var f = t.finishedAt ? new Date(t.finishedAt).getTime() : NaN;
    if (t.state === 'done' && t.untimed) return 'not timed'; // (item 122: finished with no real start, or in an instant: the time would be false)
    if (t.state === 'done') {
      var took = typeof t.took === 'number' && t.took >= 0 ? t.took * 1000 : (!isNaN(s) && !isNaN(f) && f >= s ? f - s : NaN);
      if (!isNaN(s) && !isNaN(took)) return stamp(t.startedAt, nowMs) + ', took ' + span(took);
      if (!isNaN(s)) return stamp(t.startedAt, nowMs);
      if (!isNaN(took)) return 'took ' + span(took);
      return '';
    }
    if (t.state === 'on' && !isNaN(s)) return stamp(t.startedAt, nowMs) + (nowMs >= s ? ', on for ' + span(nowMs - s) : '');
    return '';
  }
  /* taskWords:end */

  /* The gap between two items (item 86): the file says so (`between`), or `now` still names an item the list says is finished: a finished item is never shown as running. */
  function betweenOf(now, lastOf) {
    if (data.between && data.between.at) return { text: String(data.between.text || ''), at: data.between.at };
    var cur = now ? lastOf[now.number] : null;
    if (cur && (isFinished(cur) || cur.state === 'blocked')) return { text: 'Item ' + now.number + (cur.title ? ' (' + cur.title + ')' : '') + ' finished' + (cur.finishedAt ? ' at ' + clock(cur.finishedAt) : '') + '; the next item has not started yet', at: cur.finishedAt || null, own: true };
    return null;
  }
  function betweenLine(b, nowMs) {
    var at = b.at ? new Date(b.at).getTime() : NaN;
    if (b.own) return 'Between items: ' + b.text + (isNaN(at) ? '' : ', ' + span(Math.max(0, nowMs - at)) + ' so far');
    return 'Between items: ' + b.text + (isNaN(at) ? '' : ', since ' + clock(b.at) + ', ' + span(Math.max(0, nowMs - at)) + ' so far');
  }

  /* depLines:start */
  /* Item 117: under an open item's title: "Waits for 199 ..., 201 ..." (each number with its title in the list; a number that is Done, or no longer in the list, is ticked; nothing when all are done), "Holds up 200, 202" (the open items that wait for this one, worked out from their `after`), "Queued by 199". */
  function depLines(it, lastOf, items) {
    var out = [];
    var after = Array.isArray(it.after) ? it.after.filter(function (n) { return typeof n === 'number'; }) : [];
    var open = after.filter(function (n) { var e = lastOf[n]; return e && !isFinished(e); });
    if (open.length) {
      var w = el('span', 'deps');
      w.append(document.createTextNode('Waits for '));
      after.forEach(function (n, k) {
        var e = lastOf[n];
        var done = !e || isFinished(e);
        var part = el('span', done ? 'ok' : null, (done ? '\u2713 ' : '') + n + (e && e.title ? ' ' + e.title : ''));
        w.append(part);
        if (k < after.length - 1) w.append(document.createTextNode(', '));
      });
      out.push(w);
    }
    var holds = items.filter(function (o) { return o !== it && !isFinished(o) && Array.isArray(o.after) && o.after.indexOf(it.number) >= 0; }).map(function (o) { return o.number; });
    if (holds.length) out.push(el('span', 'deps', 'Holds up ' + holds.join(', ')));
    if (typeof it.queuedBy === 'number') out.push(el('span', 'deps', 'Queued by ' + it.queuedBy));
    return out;
  }
  /* depLines:end */

  /* ---------- drawing ---------- */

  function setBar(bar, pct, done) {
    bar.classList.toggle('done', !!done);
    bar.firstElementChild.style.width = Math.round(pct) + '%';
    bar.setAttribute('aria-valuenow', Math.round(pct));
  }

  function taskNode(t, path, nowMs, sub) {
    var li = el('li', t.state === 'done' ? 'done' : t.state === 'on' ? 'on' : '');
    li.dataset.path = path;
    li.append(el('span', 'mark', t.state === 'done' ? '✓' : t.state === 'on' ? '➜' : '·'));
    var label = el('span', 'label', t.label);
    if (overrun(t, nowMs)) label.append(el('span', 'late', 'taking longer than guessed'));
    else if (t.state === 'on' && t.estimateSec && t.estimateSec >= 120) label.append(el('span', 'late', 'working on a long step'));
    var tw = taskWords(t, nowMs);
    if (tw) label.append(el('span', 'when', tw));
    li.append(label);
    if (t.estimateSec || (t.subtasks && t.subtasks.length) || t.state === 'done') {
      var bar = el('span', 'tbar');
      bar.append(document.createElement('i'));
      bar.firstElementChild.style.width = Math.round(steady(path + '|' + (t.startedAt || ''), fake(t, nowMs)) * 100) + '%';
      li.append(bar);
    }
    if (t.subtasks && t.subtasks.length) {
      var ul = el('ul', 'sub');
      t.subtasks.forEach(function (s, i) { ul.append(taskNode(s, path + '.' + i, nowMs, true)); });
      li.append(ul);
    }
    return li;
  }

  function draw() {
    scale = data && typeof data.scale === 'number' && data.scale >= 0.2 && data.scale <= 1.5 ? data.scale : 1;
    if (!data) return;
    var nowMs = Date.now();
    var now = data.now;
    var finished = data.state === 'finished';

    var asking = $('asking');
    asking.hidden = !data.asking;
    asking.textContent = data.asking ? 'The builder is waiting for you: ' + data.asking : '';

    // (an item number that is in the list twice counts once, the LAST entry winning, kept where it first appeared: a later done beats an earlier waiting)
    var lastOf = {};
    (data.items || []).forEach(function (i) { if (i) lastOf[i.number] = i; });
    var seenNo = {};
    var items = [];
    (data.items || []).forEach(function (i) { if (i && !seenNo[i.number]) { seenNo[i.number] = true; items.push(lastOf[i.number]); } });
    var doneItems = items.filter(isFinished);
    var open = items.filter(function (i) { return !isFinished(i); });
    var blocked = items.filter(function (i) { return i.state === 'blocked'; }).length;
    var part = items.filter(function (i) { return i.state === 'part'; }).length;

    between = finished || !now ? null : betweenOf(now, lastOf);
    $('bar-words').hidden = !!between;
    $('now-bar').hidden = !!between;
    $('tasks').hidden = !!between;
    if (between) { $('now-end').hidden = true; $('guess').hidden = true; }

    if (finished || !now) {
      $('now-num').textContent = '✓';
      $('now-num').dataset.digits = '1';
      $('now-title').textContent = 'All done';
      $('now-doing').textContent = data.summary || 'Nothing is being built.';
      setBar($('now-bar'), 100, true);
      $('now-pct').textContent = '';
      $('now-time').textContent = data.finishedAt ? 'Finished ' + clock(data.finishedAt) : '';
      $('now-end').hidden = true;
      var counts = $('counts');
      counts.hidden = false;
      counts.textContent = (doneItems.length - part) + ' done, ' + part + ' done in part, ' + blocked + ' blocked' + (data.finishedAt ? ', at ' + clock(data.finishedAt) : '') + '.';
      $('tasks').replaceChildren();
      $('guess').hidden = true;
    } else if (between) {
      $('counts').hidden = true;
      $('now-num').textContent = '·';
      $('now-num').dataset.digits = '1';
      $('now-title').textContent = 'Between items';
      $('now-doing').textContent = betweenLine(between, nowMs);
      $('tasks').replaceChildren();
    } else {
      $('counts').hidden = true;
      $('now-num').textContent = now.number;
      $('now-num').dataset.digits = String(String(now.number).length);
      $('now-title').textContent = now.title;
      var doing = $('now-doing');
      doing.replaceChildren(el('b', null, 'Now: '), document.createTextNode(now.doing || ''));
      var tasks = now.tasks || now.steps || [];
      var has = tasks.some(function (t) { return t.estimateSec || (t.subtasks && t.subtasks.length); });
      var pct;
      if (has) {
        var sum = 0;
        tasks.forEach(function (t, i) { sum += steady('t' + i + '|' + (t.startedAt || ''), fake(t, nowMs)); });
        pct = tasks.length ? (sum / tasks.length) * 100 : 0;
      } else if (typeof now.percent === 'number') pct = Math.max(0, Math.min(100, Math.round(now.percent)));
      else if (tasks.length) pct = (tasks.reduce(function (s, t, i) { return s + steady('t' + i + '|' + (t.startedAt || ''), fake(t, nowMs)); }, 0) / tasks.length) * 100;
      else pct = null; // (neither a percentage nor tasks: the bar stays empty and no percentage is shown)
      if (pct !== null) pct = steady('now|' + now.number, pct / 100) * 100;
      // (the guessed finish: only while the item is in play, not when it is Done, Blocked or waiting for the player)
      var mine = lastOf[now.number];
      var inPlay = !mine || mine.state === 'working';
      var fin = inPlay ? finishTime(tasks, nowMs, scale) : null;
      var endEl = $('now-end');
      endEl.hidden = !fin;
      endEl.classList.toggle('late', !!(fin && fin.later));
      if (fin) {
        var fw = finishWords(fin, nowMs);
        endEl.replaceChildren(document.createTextNode(fw[0]), el('strong', null, fw[1]), document.createTextNode(fw[2]));
      }
      setBar($('now-bar'), pct === null ? 0 : pct, false);
      var p = $('now-pct');
      if (pct === null) p.replaceChildren();
      else p.replaceChildren(el('strong', null, 'About ' + (has ? '~' : '') + Math.round(pct) + '%'), document.createTextNode(' of this item, a best guess'));
      var ul = $('tasks');
      ul.replaceChildren();
      tasks.forEach(function (t, i) { ul.append(taskNode(t, 't' + i, nowMs, false)); });
      $('guess').hidden = !has;
    }

    // the list's words and bar are for what is still REMAINING (item 123): the builder is always on the first of them, so with 10 left the bar is 10%, with 2 left 50%, and it is only full when nothing remains
    // (the "need you" count is the number of items whose state is needs-you; the reason each needs the player is shown under its title in the list)
    var needsYou = Array.isArray(data.needsYou) ? data.needsYou : [];
    var needs = items.filter(function (i) { return i.state === 'needs-you'; }).length;
    var remaining = open.length;
    var words = remaining ? remaining + (remaining === 1 ? ' item' : ' items') + ' remaining' : 'Nothing remaining: the list is finished';
    if (remaining && needs) words += ', ' + needs + ' need' + (needs === 1 ? 's' : '') + ' you at the computer';
    if (remaining && blocked) words += ', ' + blocked + ' blocked';
    var pausedN = items.filter(function (i) { return i.state === 'paused'; }).length; // (item 124: dependents of a paused item are in the file as paused too)
    if (remaining && pausedN) words += ', ' + pausedN + ' paused';
    $('list-count').textContent = words;
    setBar($('list-bar'), remainingPercent(remaining), true);

    var ul2 = $('items');
    ul2.replaceChildren();
    open.forEach(function (i) {
      var st = STATES[i.state] || STATES.waiting;
      var li = el('li', st.cls + (i.state === 'working' ? ' is-working' : ''));
      var title = el('span', 'title', i.title);
      var when = '';
      if (i.state === 'working' && i.startedAt) when = 'Started ' + clock(i.startedAt);
      if (i.note) when = when ? when + '. ' + i.note : i.note;
      if (when) title.append(el('span', 'when', when));
      if (i.state === 'needs-you') {
        var why = needsYou.filter(function (n) { return n && String(n.number) === String(i.number); })[0]; // (item 121: from the matching needsYou entry, by number; nothing when there is none)
        if (why && why.needs != null && String(why.needs)) title.append(el('span', 'what', String(why.needs)));
      }
      if (i.state === 'paused') {
        // (item 124: the reason the player gave, in words; an item held only because it waits for a paused one says which, and why that one is)
        var head = i.pausedFor ? lastOf[i.pausedFor] : null;
        var pw = i.pausedFor ? 'Paused because ' + i.pausedFor + ' is' + (head && head.reason ? ': ' + head.reason : '') : 'Paused: ' + (i.reason ? String(i.reason) : 'No reason was given');
        title.append(el('span', 'what', pw));
      }
      depLines(i, lastOf, items).forEach(function (line) { title.append(line); });
      li.append(el('span', 'num', i.number), title, el('span', 'chip', st.chip));
      ul2.append(li);
    });
    numWidth(ul2, open);

    // the finished items, newest first, each with when it started and how long it took (not crossed out: the dimmer colour and the chip say it is finished)
    $('done-part').hidden = doneItems.length === 0;
    var dl = $('done-items');
    dl.replaceChildren();
    var doneSorted = doneItems.slice().sort(function (a, b) { return (b.finishedAt ? new Date(b.finishedAt) : 0) - (a.finishedAt ? new Date(a.finishedAt) : 0); });
    var DONE_SHOWN = 20; // (only the newest 20 are drawn; the count and the bar above still count every item)
    // (item 160: N is every item the permanent record says is finished, when the file has it; never fewer than the finished items the file itself holds)
    var doneAll = typeof data.doneTotal === 'number' && data.doneTotal >= 0 ? Math.max(Math.floor(data.doneTotal), doneSorted.length) : doneSorted.length;
    $('done-head').textContent = doneAll > DONE_SHOWN ? 'Done: the last ' + DONE_SHOWN + ' of ' + doneAll : 'Done';
    doneSorted = doneSorted.slice(0, DONE_SHOWN);
    doneSorted.forEach(function (i) {
      var st = STATES[i.state] || STATES.done;
      var li = el('li', st.cls);
      var title = el('span', 'title', i.title);
      var when = doneWords(i, nowMs);
      if (i.note) when = when ? when + '. ' + i.note : i.note;
      if (when) title.append(el('span', 'when', when));
      li.append(el('span', 'num', i.number), title, el('span', 'chip', st.chip));
      dl.append(li);
    });
    numWidth(dl, doneSorted);

    clockParts();
  }

  /* The parts that move with the clock, once a second, only while the page is in front. */
  function clockParts() {
    if (!data) return;
    var nowMs = Date.now();
    var age = nowMs - new Date(data.updatedAt).getTime();
    var finished = data.state === 'finished' || !data.now;
    // the runner says the Claude usage limit stopped the run (item 81): one line, never any log text
    var pz = $('paused');
    if (data.paused && data.paused.at) {
      pz.hidden = false;
      pz.textContent = 'Paused: the Claude usage limit was reached. ' + (data.paused.until ? 'Trying again at ' + clock(data.paused.until) + '.' : 'Trying again soon.');
    } else pz.hidden = true;
    $('fresh').textContent = 'Progress changed ' + span(age) + ' ago';
    // (item 120) while a run is going and the file has not been written for 10 minutes: when it was last written, by the viewer's clock, counting up while the page is open
    var bq = $('builder-quiet');
    var wrote = new Date(data.updatedAt).getTime();
    if (data.state === 'working' && !isNaN(wrote) && nowMs - wrote > BUILDER_QUIET_AFTER) {
      bq.hidden = false;
      bq.textContent = 'No word from the builder since ' + stamp(data.updatedAt, nowMs) + ' (' + span(nowMs - wrote) + ')';
    } else bq.hidden = true;
    // the watcher's own note (item 80): the time it last looked at the builder's file, written into the file it uploads while a build is going; with no note nothing is said about it
    var checked = data.watcherCheckedAt ? new Date(data.watcherCheckedAt).getTime() : NaN;
    var wl = $('watcher');
    if (data.state !== 'working' || isNaN(checked)) wl.hidden = true;
    else {
      var wage = Math.max(0, nowMs - checked);
      var deadWatcher = wage > WATCHER_QUIET_AFTER;
      wl.hidden = false;
      wl.classList.toggle('stale', deadWatcher);
      wl.textContent = deadWatcher ? 'The watcher has not checked for ' + span(wage) + ': this page may be out of date.' : 'The watcher last looked ' + span(wage) + ' ago';
    }
    var running = null;
    if (!finished) (data.now.tasks || data.now.steps || []).forEach(function (t) { if (t.state === 'on') running = t; });
    var allowed = QUIET_AFTER + (running && running.estimateSec ? running.estimateSec * 1000 : 0);
    var quiet = !finished && age > allowed;
    $('fresh').classList.toggle('stale', quiet);
    var warn = $('stale');
    warn.hidden = !quiet;
    if (quiet) warn.textContent = 'No update for ' + span(age) + '. The builder may have stopped: look at VS Code.';
    if (between && !finished) {
      var bAt = between.at ? new Date(between.at).getTime() : NaN;
      $('now-doing').textContent = betweenLine(between, nowMs);
      var longGap = !isNaN(bAt) && nowMs - bAt > BETWEEN_QUIET_AFTER && !(data.paused && data.paused.at);
      if (longGap) { warn.hidden = false; warn.textContent = 'Between items for ' + span(nowMs - bAt) + '. The builder may have stopped: look at VS Code.'; $('fresh').classList.add('stale'); }
      else if (!quiet) warn.hidden = true;
    }
    if (!finished && data.now.startedAt) $('now-time').textContent = 'Started ' + clock(data.now.startedAt) + ', ' + span(nowMs - new Date(data.now.startedAt)) + ' so far';
  }

  /* Once a second, only while the page is in front: the clock, and the bars (the page moves them between updates, from the same file). */
  function tick() {
    if (!data || document.hidden) return;
    var finished = data.state === 'finished' || !data.now;
    var tasks = finished ? [] : (data.now.tasks || data.now.steps || []);
    if (tasks.some(function (t) { return t.estimateSec || (t.subtasks && t.subtasks.length); })) draw();
    else clockParts();
  }

  /* ---------- the look of a wrong link: the website's own 404 page, put in place of this one ---------- */

  function notFound() {
    stopped = true;
    fetch('/404.html', { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (html) { document.open(); document.write(html); document.close(); })
      .catch(function () { document.body.textContent = 'Page not found.'; });
  }

  /* ---------- reading the file ---------- */

  var stopped = false;
  var timer = 0;
  var tickTimer = 0;

  function load() {
    if (stopped || document.hidden) return;
    fetch(STORE + name + '.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (r.status === 404 && !gotGood) { notFound(); return null; } // (only the first answer: a later 404 is any other failure)
        if (!r.ok) throw new Error('status ' + r.status);
        return r.json();
      })
      .then(function (j) {
        if (!j || stopped) return;
        if (!j.updatedAt || !Array.isArray(j.items)) throw new Error('shape');
        gotGood = true;
        build();
        $('page').hidden = false;
        $('failed').hidden = true;
        if (!data || data.updatedAt !== j.updatedAt || data.watcherCheckedAt !== j.watcherCheckedAt) { data = j; draw(); }
        schedule(); // (how often to look again depends on whether everything is done)
      })
      .catch(function () {
        if (stopped) return;
        if (!gotGood) return; // (before the first good answer the page stays empty)
        var f = $('failed');
        f.hidden = false;
        f.textContent = 'The page cannot fetch the progress just now. It is showing what it last had.';
      });
  }

  function schedule() {
    clearTimeout(timer);
    var finished = data && (data.state === 'finished' || !data.now);
    timer = setTimeout(function () { load(); schedule(); }, finished ? CHECK_DONE : CHECK_EVERY);
  }

  // Without a whole link the page is the website's 404 page.
  if (!/^[a-z0-9]{24,}$/.test(name)) { notFound(); return; }
  load();
  schedule();
  tickTimer = setInterval(tick, 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { load(); tick(); } });
})();
</script>
</body>
</html>
